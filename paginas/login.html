<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../estilos/login.css" />
  </head>
  <body>
    <img src="../img/logo.png" alt="Logo do Site" width="80" />
    <div class="login">
      <h2>Faça o seu Login</h2>
      <form action="banco-de-dados/banco.html" method="get">
        <label for="iemail">Email </label>
        <input type="email" name="email" id="iemail" required />

        <label for="isenha">Senha </label>
        <input
          type="password"
          name="senha"
          id="isenha"
          required
          maxlength="16"
          minlength="8"
        />

        <input id="bt" type="submit" value="Entrar" />
        <a href="cadastro.html">Ou cadastre-se</a>
      </form>
    </div>
  </body>
</html>
